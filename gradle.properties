group=com.infinitetoken
# LumberClient.VERSION must match, and a release's tag is this with a v (v1.0.0)
version=1.0.0
org.gradle.caching=true
org.gradle.parallel=true

# Maven Central (the Central Portal), through com.vanniktech.maven.publish. Each module names and describes itself in
# its own build file; what they share is here. The credentials and signing key come from the publish workflow's secrets.
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
signAllPublications=true
POM_INCEPTION_YEAR=2026
POM_URL=https://lumber.infinitetoken.com
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/license/mit
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/infinitetoken/Lumber-Java
POM_SCM_CONNECTION=scm:git:https://github.com/infinitetoken/Lumber-Java.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/infinitetoken/Lumber-Java.git
POM_DEVELOPER_ID=jayrdeaton
POM_DEVELOPER_NAME=Jay Deaton
POM_DEVELOPER_URL=https://github.com/jayrdeaton
