name: CI
run-name: 'CI: ${{ github.event.pull_request.title || github.event.head_commit.message }}'

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Java the library supports, each long-term release since, and the newest
        java: ['11', '17', '21', '25', '27']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The matrix's Java runs the tests; the last one listed, 21, runs Gradle
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build javadoc -PtestJava=${{ matrix.java }} -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # lumber/src/test/resources/contract must be Lumber-Kit's contract at the version in its VERSION file
      - run: scripts/sync-contract.sh && git diff --exit-code lumber/src/test/resources/contract
